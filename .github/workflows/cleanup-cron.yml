name: DeploShare Storage Cleanup Cron

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DeploShare Maintenance Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://deploshare.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering Storage Maintenance Purge..."
          curl -s -X POST "$APP_URL/api/cron/cleanup" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
